<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tusome AI — Tusome EduShelf</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.brand{font-size:24px;font-weight:800}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#e8eefc}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:18px;box-shadow:0 8px 30px #17203310;overflow:hidden}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e8ebf1}.toolbar select,.toolbar button{border:1px solid #d8deea;border-radius:10px;background:#fff;padding:9px 12px}.toolbar button{cursor:pointer}.chat{height:62vh;min-height:430px;overflow:auto;padding:18px}.msg{max-width:82%;padding:12px 14px;margin:10px 0;border-radius:14px;line-height:1.55;white-space:pre-wrap}.user{margin-left:auto;background:#eaf0ff}.assistant{background:#f0f2f6}.meta{font-size:11px;opacity:.55;margin-bottom:4px}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid #e8ebf1}.composer textarea{flex:1;resize:none;min-height:55px;border:1px solid #d8deea;border-radius:12px;padding:12px;font:inherit}.send{border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.tests{display:flex;gap:7px;flex-wrap:wrap;padding:12px;border-top:1px solid #e8ebf1}.tests button{border:1px solid #d8deea;background:#fff;border-radius:9px;padding:8px;cursor:pointer}@media(max-width:650px){.app{padding:10px}.chat{height:65vh}.msg{max-width:92%}.top{align-items:flex-start}.composer{align-items:stretch}.send{padding:0 13px}}
</style></head>
<body><main class="app">
<div class="top"><div><div class="brand">🤖 Tusome AI</div><div style="opacity:.65">Standalone capability-testing laboratory</div></div><span id="status" class="badge">Checking AI…</span></div>
<section class="panel">
<div class="toolbar"><label>Mode <select id="mode"><option value="general">General</option><option value="learn">Learn</option><option value="reason">Reason</option><option value="code">Code</option><option value="creative">Creative</option><option value="research">Research</option></select></label><button id="clear">New chat</button></div>
<div id="chat" class="chat"><div class="msg assistant"><div class="meta">Tusome AI</div>Hello! I’m the standalone Tusome AI prototype. Test me with general questions, maths, science, coding, reasoning, writing and other tasks.</div></div>
<div class="tests"><button data-q="Explain photosynthesis simply, then give a more advanced explanation.">Science test</button><button data-q="Solve 3x² - 7x - 6 = 0 and verify both roots.">Math test</button><button data-q="Write a small JavaScript function that removes duplicate values from an array.">Code test</button><button data-q="A train travels 180 km in 2 hours 15 minutes. What is its average speed in km/h? Show the check.">Reasoning test</button><button data-q="What kinds of information would you need to verify before answering a question about today's events?">Freshness test</button></div>
<form id="form" class="composer"><textarea id="prompt" placeholder="Ask Tusome AI anything…"></textarea><button class="send" type="submit">Send</button></form>
</section></main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),prompt=document.getElementById('prompt'),mode=document.getElementById('mode'),status=document.getElementById('status');
let history=[];
function add(role,text,meta=''){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=(meta?'<div class="meta">'+meta+'</div>':'')+escapeHtml(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function health(){try{const r=await fetch('/api/tusome-ai/health');const d=await r.json();status.textContent=d.configured?'AI configured':'API key required';status.style.background=d.configured?'#e8f7ee':'#fff0d9'}catch{status.textContent='Server offline';status.style.background='#ffe7e7'}}
async function send(text){text=String(text||prompt.value).trim();if(!text)return;prompt.value='';add('user',text,'You');const pending=add('assistant','Thinking…','Tusome AI');const old=history.slice();history.push({role:'user',text});try{const r=await fetch('/api/tusome-ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,mode:mode.value,history:old})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');pending.innerHTML='<div class="meta">Tusome AI • '+escapeHtml(d.model||'model')+'</div>'+escapeHtml(d.answer);history.push({role:'assistant',text:d.answer})}catch(e){pending.innerHTML='<div class="meta">Tusome AI</div>'+escapeHtml('Error: '+e.message);history.pop()}}
form.addEventListener('submit',e=>{e.preventDefault();send()});document.getElementById('clear').onclick=()=>{history=[];chat.innerHTML='<div class="msg assistant"><div class="meta">Tusome AI</div>New conversation started.</div>'};document.querySelectorAll('.tests button').forEach(b=>b.onclick=()=>{prompt.value=b.dataset.q;prompt.focus()});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});health();
</script></body></html>
