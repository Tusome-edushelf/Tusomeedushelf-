<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tusome AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.brand{font-size:24px;font-weight:800}.sub{opacity:.65}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#e8eefc}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:18px;box-shadow:0 8px 30px #17203310;overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e8ebf1}.toolbar select,.toolbar button,.file-btn{border:1px solid #d8deea;border-radius:10px;background:#fff;padding:9px 12px}.toolbar button,.file-btn{cursor:pointer}.toolbar .back{margin-left:auto}.chat{height:62vh;min-height:430px;overflow:auto;padding:18px}.msg{max-width:82%;padding:12px 14px;margin:10px 0;border-radius:14px;line-height:1.55;white-space:pre-wrap}.user{margin-left:auto;background:#eaf0ff}.assistant{background:#f0f2f6}.meta{font-size:11px;opacity:.55;margin-bottom:4px}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid #e8ebf1}.composer textarea{flex:1;resize:none;min-height:55px;border:1px solid #d8deea;border-radius:12px;padding:12px;font:inherit}.send{border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.tests{display:flex;gap:7px;flex-wrap:wrap;padding:12px;border-top:1px solid #e8ebf1}.tests button{border:1px solid #d8deea;background:#fff;border-radius:9px;padding:8px;cursor:pointer}.file-row{padding:0 12px 12px;border-top:1px solid #e8ebf1}.file-row small{opacity:.65}@media(max-width:650px){.app{padding:10px}.chat{height:65vh}.msg{max-width:92%}.top{align-items:flex-start}.composer{align-items:stretch}.send{padding:0 13px}.toolbar .back{margin-left:0}}
</style></head>
<body><main class="app">
<div class="top"><div><div class="brand">🤖 Tusome AI</div><div class="sub">Separate general-purpose AI inside Tusome EduShelf</div></div><span id="status" class="badge">Checking AI…</span></div>
<section class="panel">
<div class="toolbar">
<label>Mode <select id="mode"><option value="general">General</option><option value="learn">Learn</option><option value="reason">Reason</option><option value="code">Code</option><option value="creative">Creative</option><option value="research">Research</option></select></label>
<label>Thinking <select id="thinking"><option value="low">Fast</option><option value="medium" selected>Balanced</option><option value="high">Deep</option></select></label>
<button id="clear" type="button">New chat</button><button class="back" type="button" onclick="location.href='/'">← EduShelf</button>
</div>
<div class="file-row"><label class="file-btn">📎 Attach file <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.txt,.csv,.json,.md" hidden></label> <small id="fileName">No file selected. Max 10 MB.</small></div>
<div id="chat" class="chat"><div class="msg assistant"><div class="meta">Tusome AI</div>Hello! I’m Tusome AI. I can help with general questions, learning, mathematics, science, coding, reasoning, writing, research and more.</div></div>
<div class="tests"><button data-q="Explain photosynthesis simply, then give a more advanced explanation." type="button">Science test</button><button data-q="Solve 3x² - 7x - 6 = 0 and verify both roots." type="button">Math test</button><button data-q="Write a small JavaScript function that removes duplicate values from an array." type="button">Code test</button><button data-q="A train travels 180 km in 2 hours 15 minutes. What is its average speed in km/h? Show the check." type="button">Reasoning test</button><button data-q="What kinds of information would you need to verify before answering a question about today's events?" type="button">Freshness test</button></div>
<form id="form" class="composer"><textarea id="prompt" placeholder="Ask Tusome AI anything…"></textarea><button class="send" type="submit">Send</button></form>
</section></main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),prompt=document.getElementById('prompt'),mode=document.getElementById('mode'),thinking=document.getElementById('thinking'),status=document.getElementById('status'),fileInput=document.getElementById('file'),fileName=document.getElementById('fileName');let history=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(role,text,meta=''){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=(meta?'<div class="meta">'+esc(meta)+'</div>':'')+esc(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function health(){try{const r=await fetch('/api/tusome-ai/health');const d=await r.json();status.textContent=d.configured?'AI configured':'API key required';status.style.background=d.configured?'#e8f7ee':'#fff0d9'}catch{status.textContent='Server offline';status.style.background='#ffe7e7'}}
function readFile(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>10*1024*1024)return reject(new Error('The uploaded file is too large. Please keep it below 10 MB.'));const rd=new FileReader();rd.onload=()=>resolve({name:file.name,mimeType:file.type||'application/octet-stream',data:rd.result});rd.onerror=()=>reject(new Error('Could not read the selected file.'));rd.readAsDataURL(file)})}
async function send(text){text=String(text||prompt.value).trim();const selected=fileInput.files[0];if(!text&&!selected)return;prompt.value='';add('user',text||('Attached file: '+selected.name),'You');const pending=add('assistant','Thinking…','Tusome AI');const old=history.slice();history.push({role:'user',text:text||('Attached file: '+selected.name)});try{const file=await readFile(selected);const r=await fetch('/api/tusome-ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,mode:mode.value,thinkingLevel:thinking.value,history:old,file})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');pending.innerHTML='<div class="meta">Tusome AI • '+esc(d.model||'model')+' • '+esc(d.thinkingLevel||thinking.value)+'</div>'+esc(d.answer);history.push({role:'assistant',text:d.answer});fileInput.value='';fileName.textContent='No file selected. Max 10 MB.'}catch(e){pending.innerHTML='<div class="meta">Tusome AI</div>'+esc('Error: '+e.message);history.pop()}}
form.addEventListener('submit',e=>{e.preventDefault();send()});document.getElementById('clear').onclick=()=>{history=[];chat.innerHTML='<div class="msg assistant"><div class="meta">Tusome AI</div>New conversation started.</div>'};document.querySelectorAll('.tests button').forEach(b=>b.onclick=()=>{prompt.value=b.dataset.q;prompt.focus()});fileInput.addEventListener('change',()=>{fileName.textContent=fileInput.files[0]?fileInput.files[0].name:'No file selected. Max 10 MB.'});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});health();
</script></body></html>
